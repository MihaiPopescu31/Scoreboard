<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!--UPDATING THE TITLE-->
    <title>COURTSIDE - Basketball Scoreboard</title>
  </head>
  <body>
    <div class="board">
      <header class="header">
        <h1>COURTSIDE</h1>
        <div class="live-indicator">LIVE</div>
      </header>
      <main class="scoreboard">
        <section class="team-card home-card">
          <h3>HOME</h3>
          <h2>WOLVES</h2>
          <div class="score" id="home-score">00</div>
          <div class="buttons-home">
            <button class="btn-score" data-points="1">+1</button>
            <button class="btn-score" data-points="2">+2</button>
            <button class="btn-score" data-points="3">+3</button>
          </div>
          <div class="score-divider"></div>
          <div class="lead-indicator" id="home-lead"></div>
          <div class="team-stats">
            <div class="stat">
              <span class="stat-label">FOULS</span>
              <span class="stat-value" id="home-fouls">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">REBOUNDS</span>
              <span class="stat-value" id="home-rebounds">0</span>
            </div>
          </div>
        </section>
        <section class="team-card guest-card">
          <h3>GUEST</h3>
          <h2>TITANS</h2>
          <div class="score" id="guest-score">00</div>
          <div class="buttons-guest">
            <button class="btn-score" data-points="1">+1</button>
            <button class="btn-score" data-points="2">+2</button>
            <button class="btn-score" data-points="3">+3</button>
          </div>
          <div class="score-divider"></div>
          <div class="lead-indicator" id="guest-lead"></div>
          <div class="team-stats">
            <div class="stat">
              <span class="stat-label">FOULS</span>
              <span class="stat-value" id="guest-fouls">0</span>
            </div>

            <div class="stat">
              <span class="stat-label">REBOUNDS</span>
              <span class="stat-value" id="guest-rebounds">0</span>
            </div>
          </div>
        </section>
      </main>
      <section class="game-timer">
        <div class="timer" id="timer">10:00</div>
        <div class="period" id="period">PERIOD 1</div>
      </section>
      <!--Adding the neW game button-->
      <div class="game-controls">
        <button id="start-btn">START</button>
        <button id="pause-btn">PAUSE</button>
        <button id="new-game-btn">NEW GAME</button>
        <button id="next-period-btn">NEXT PERIOD</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
