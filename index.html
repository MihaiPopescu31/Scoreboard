<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Basketball Scoreboard</title>
  </head>
  <body>
    <div class="board">
      <div>
        <h3>HOME</h3>
        <div class="score" id="home-score">0</div>
        <div class="buttons-home">
          <button class="btn-score" data-points="1">+1</button>
          <button class="btn-score" data-points="2">+2</button>
          <button class="btn-score" data-points="3">+3</button>
        </div>
      </div>
      <div>
        <h3>GUEST</h3>
        <div class="score" id="guest-score">0</div>
        <div class="buttons-guest">
          <button class="btn-score" data-points="1">+1</button>
          <button class="btn-score" data-points="2">+2</button>
          <button class="btn-score" data-points="3">+3</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
